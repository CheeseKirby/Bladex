spring:
  datasource:
    url: jdbc:h2:mem:ai_workflow;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      schema-locations: classpath:schema-h2.sql
      mode: always

ai-workflow:
  target-project-root: target/ai-workflow-test-target
  output-root: target/ai-workflow-test-output
  part-a-callback-url: http://localhost:3004/api/transmission/status-update
  admin:
    token: test-token
